name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Version 5 project
        shell: bash
        run: |
          set -e

          mkdir -p extracted

          ZIP_FILE="./AviatorAuto_v5_GitHub_Upload.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "Version 5 ZIP was not found."
            exit 1
          fi

          echo "Using: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted

          GRADLEW=$(find extracted -type f -name gradlew | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "gradlew was not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build Version 5 APK
        shell: bash
        run: |
          set -e
          chmod +x "$PROJECT_DIR/gradlew"
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: Upload Version 5 APK
        uses: actions/upload-artifact@v4
        with:
          name: Aviator-Auto-Analyzer-v5
          path: |
            extracted/**/app/build/outputs/apk/**/*.apk
            extracted/**/app/build/outputs/apk/*.apk
